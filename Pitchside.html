<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pitchside</title>
<meta name="description" content="Turn a match recording into highlights and stats. Free, private, runs on your device.">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1511" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pitchside">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Pitchside - own visual identity: chalk paper, pitch green vs clay, floodlight yellow */
:root{
  --bg:#F4F1EA; --surface:#FFFFFF; --ink:#14211B; --muted:#5E6B63; --line:#E2DDD0;
  --us:#14804A; --them:#D9552B; --accent:#F1B51C; --btn:#14211B; --btn-ink:#F4F1EA; --on-mark:#FFFFFF;
  --shadow:0 1px 0 rgba(20,33,27,.04),0 8px 24px rgba(20,33,27,.06);
  --r:16px; color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0C1511; --surface:#14201A; --ink:#EEF3EE; --muted:#98A89F; --line:#25352C;
    --us:#3DD68C; --them:#FF7A50; --accent:#F6C84A; --btn:#EEF3EE; --btn-ink:#0C1511; --on-mark:#0C1511; --shadow:none}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(40px + env(safe-area-inset-bottom));min-height:100vh}
#app{max-width:560px;margin:0 auto}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.stack{display:flex;flex-direction:column;gap:14px;padding:6px 16px 24px}
h1{font-size:30px;line-height:1.1;letter-spacing:-.02em}
h2{font-size:20px;letter-spacing:-.01em}
h3{font-size:16px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-top:4px}
.lead{color:var(--muted)} .hint,.note,small{color:var(--muted);font-size:13px;line-height:1.4}
.note{margin-top:10px}
code{background:var(--bg);padding:1px 6px;border-radius:6px;font-size:13px}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:14px 12px 8px;position:sticky;top:0;z-index:20;background:var(--bg)}
.top .back,.top .icon,.icon-space{width:44px;height:44px;display:grid;place-items:center;font-size:30px;line-height:1;border-radius:12px;text-decoration:none;flex:none}
.top .icon{font-size:22px;font-weight:700}
.ttl{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column}
.ttl b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{font-size:12px}
.top.home{padding-left:16px}
.brand{display:flex;align-items:center;gap:10px;flex:1;font-size:21px;letter-spacing:-.02em}
.mark{width:26px;height:26px;border-radius:8px;background:var(--us);position:relative;display:inline-block}
.mark::after{content:"";position:absolute;inset:5px;border:2px solid #fff;border-radius:50%;opacity:.9}
.mark::before{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:2px;background:#fff;opacity:.9;transform:translateX(-1px)}

/* buttons */
.primary,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;
  background:var(--btn);color:var(--btn-ink);font-weight:700;text-decoration:none;border:0;text-align:center}
.primary:disabled{opacity:.4;cursor:not-allowed}
.primary.big{min-height:56px;font-size:17px}
.primary.sm{min-height:44px;padding:0 16px;font-size:15px}
.btn.ghost,button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);min-height:44px;padding:0 16px;border-radius:12px;font-weight:600}
button.ghost.sm{min-height:36px;padding:0 12px;font-size:14px}
button.ghost.wide{width:100%}
button:disabled{opacity:.45}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card.quiet{background:transparent;box-shadow:none;border-style:dashed}
.cardhd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.notice{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:12px;padding:12px 14px;font-size:14px}
.prose ol,.prose ul{padding-left:20px;display:flex;flex-direction:column;gap:8px}
.prose p{line-height:1.5}

/* home */
.hero{padding:12px 2px 4px;display:flex;flex-direction:column;gap:14px}
.hero p{color:var(--muted)}
.steps{list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s;margin-top:4px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--us);color:var(--on-mark);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.list{display:flex;flex-direction:column;gap:10px}
.match{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;box-shadow:var(--shadow)}
.match b{font-size:16px}.match .v{color:var(--muted);margin:0 6px;font-size:13px}
.match small{display:block;margin-top:2px}
.sc{display:flex;gap:6px;align-items:baseline;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.sc i{color:var(--muted);font-style:normal}.sc .us{color:var(--us)}.sc .them{color:var(--them)}
.sc.dim{font-size:12px;font-weight:600;color:var(--muted);text-align:right}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:13px;font-weight:700;letter-spacing:.01em}
.fld.inline{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.fld.inline .seg{flex:1;max-width:260px}
input:not([type=file]){background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
input:focus{outline:none;border-color:var(--ink)}
.filebtn{display:flex;align-items:center;justify-content:center;min-height:48px;border:1.5px dashed var(--line);border-radius:12px;padding:0 14px;cursor:pointer;background:var(--surface);font-weight:600;color:var(--muted);text-align:center;overflow:hidden}
.filebtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label.btn.filebtn{border-style:solid;background:transparent;color:var(--ink)}
.filechip{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;overflow:hidden}
.filechip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filechip.warn{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.seg{display:flex;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.sm button{min-height:36px;padding:0 14px;flex:none}
.seg.sm button.on[data-side=us]{background:var(--us);color:var(--on-mark)}
.seg.sm button.on[data-side=them]{background:var(--them);color:var(--on-mark)}

/* tabs */
.tabs{display:flex;gap:6px;padding:0 16px 6px;position:sticky;top:72px;z-index:19;background:var(--bg)}
.tabs a{flex:1;text-align:center;padding:11px 0;text-decoration:none;font-weight:700;color:var(--muted);border-bottom:3px solid var(--line)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-style:normal;font-size:12px;background:var(--line);border-radius:999px;padding:1px 8px;margin-left:4px;color:var(--ink)}

/* summary */
.score{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0 2px}
.score .side{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center}
.score .side b{font-size:64px;line-height:1;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.score .side span{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.25;padding:0 6px}
.score .us b{color:var(--us)}.score .them b{color:var(--them)}
.score .dash{font-size:34px;color:var(--muted);flex:0 0 36px;text-align:center}
.legend{display:flex;gap:12px;font-size:12px;font-weight:700;max-width:100%}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:currentColor}
.us{color:var(--us)}.them{color:var(--them)}
.chart svg{width:100%;height:auto;display:block;touch-action:manipulation}
.chart text{fill:var(--muted);font-size:12px;font-family:inherit}
.chart .htl{font-weight:800;fill:var(--ink)}
.chart .axis{stroke:var(--line);stroke-width:1.5}.chart .ht{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 5;opacity:.6}
.chart .a-us{fill:var(--us);opacity:.2}.chart .a-them{fill:var(--them);opacity:.2}
.chart .l-us{fill:none;stroke:var(--us);stroke-width:2.4;stroke-linejoin:round}.chart .l-them{fill:none;stroke:var(--them);stroke-width:2.4;stroke-linejoin:round}
.chart .mk{cursor:pointer}
.chart .mk.us .dot{fill:var(--us)}.chart .mk.them .dot{fill:var(--them)}
.chart .mk .mt{fill:var(--on-mark);font-weight:800;font-size:12px}
.chart .mk.hollow .dot{fill:var(--surface);stroke-width:2.5px}
.chart .mk.hollow.us .dot{stroke:var(--us)}.chart .mk.hollow.them .dot{stroke:var(--them)}
.chart .mk.hollow.us .mt{fill:var(--us)}.chart .mk.hollow.them .mt{fill:var(--them)}
.chart .udot{fill:var(--muted);opacity:.7}
.share{display:flex;height:30px;border-radius:999px;overflow:hidden;font-size:13px;font-weight:800;color:var(--on-mark);margin-top:4px}
.share span{display:flex;align-items:center;justify-content:center;min-width:34px}
.share .us{background:var(--us);color:var(--on-mark)}.share .them{background:var(--them);color:var(--on-mark)}
.h2h{padding:6px 0}
.h2h .hd{display:grid;grid-template-columns:48px 1fr 48px;align-items:baseline;text-align:center}
.h2h .hd b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.h2h .hd b:first-child{text-align:left}.h2h .hd b:last-child{text-align:right}
.h2h .hd span{font-size:13px;color:var(--muted);font-weight:600}
.h2h .bars{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.h2h .half{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;display:flex}
.h2h .half.l{justify-content:flex-end}
.h2h .half i{display:block;height:100%;border-radius:4px;transition:width .35s}
.h2h .half.l i{background:var(--us)}.h2h .half.r i{background:var(--them)}
.derived{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;border-top:1px solid var(--line);padding-top:14px}
.derived div{text-align:center}.derived b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.derived span{font-size:12px;color:var(--muted)}

/* scan */
.scan{align-items:stretch;text-align:center}
.scan h2{font-size:54px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bar{height:12px;background:var(--bg);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--us);border-radius:999px;transition:width .4s}
#spark{width:100%;height:64px;margin-top:4px}

/* moments */
.player{position:sticky;top:122px;z-index:10;background:var(--bg);padding-bottom:6px}
.player video{width:100%;max-height:34vh;background:#000;border-radius:14px;display:block}
.attach{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.reelbar{display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border-radius:12px;padding:4px;margin-top:6px}
.reelbar span{flex:1;text-align:center;font-size:13px;font-weight:700}
.reelbar button{min-width:44px;min-height:40px;color:var(--bg);font-weight:800;font-size:22px;border-radius:9px}
.reelbar .stop{font-size:14px;background:color-mix(in srgb,var(--bg) 18%,transparent);padding:0 14px}
.actions{display:flex;gap:8px;align-items:center;justify-content:space-between}
.actions .ghost{flex:1;font-size:14px}
.moms{display:flex;flex-direction:column;gap:10px}
.mom{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.mom.tagged{border-color:color-mix(in srgb,var(--us) 45%,var(--line))}
.mom.playing{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.mom.skip{opacity:.55}
.mom .row{display:flex;align-items:center;gap:12px}
.mom .play{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:16px;display:grid;place-items:center;flex:none;padding-left:3px}
.mom .meta{flex:1;min-width:0}.mom .meta b{font-size:18px;font-variant-numeric:tabular-nums;display:block}.mom .meta small{display:block}
.mom .tag{display:flex;gap:8px;align-items:center}
.mom select{flex:1;min-width:0;min-height:44px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:0 10px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.sheet h4{text-align:center;color:var(--muted);font-size:13px;padding:4px 0 6px}
.sheet button{min-height:52px;border-radius:14px;background:var(--bg);font-weight:700}
.sheet .danger{color:var(--them)}.sheet .cancel{background:transparent;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;
  font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.goalbox h3{margin:0 0 4px;font-size:16px}
.goalbox .fs{display:flex;align-items:flex-end;gap:10px;margin:10px 0}
.goalbox .fs label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;min-width:0}
.goalbox .fs input{font:inherit;font-size:22px;font-weight:800;text-align:center;padding:8px;border:1.5px solid var(--line,#d8d3c6);border-radius:12px;background:var(--card,#fff);color:inherit;width:100%;box-sizing:border-box}
.goalbox .fs .dash{padding-bottom:12px;font-weight:800}

.actions.quick{display:flex;gap:8px}.actions.quick .ghost{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vidCard .fs{display:flex;gap:10px}#vidCard .fs label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
#vidCard input,#goalTimes{font:inherit;padding:10px;border:1.5px solid var(--line,#d8d3c6);border-radius:12px;background:var(--card,#fff);color:inherit;width:100%;box-sizing:border-box}
#goalTimes{margin:6px 0 10px;resize:vertical}.eg{background:rgba(0,0,0,.05);border-radius:10px;padding:8px 12px;font-size:13px;margin:6px 0;white-space:pre-wrap}
.sheet .bar{height:10px;border-radius:6px;background:rgba(0,0,0,.1);overflow:hidden;margin:10px 0}.sheet .bar i{display:block;height:100%;background:var(--accent,#F1B51C);transition:width .3s}
.sheet a.primary{display:block;text-align:center;text-decoration:none;margin:6px 0}

.sheet.wide{max-width:760px;width:calc(100% - 24px);max-height:92vh;overflow:auto}
.markwrap{background:#000;border-radius:10px;overflow:hidden;margin:8px 0}.markwrap canvas{display:block;width:100%;height:auto;cursor:crosshair}
.sheet select{font:inherit;padding:10px;border-radius:12px;border:1.5px solid var(--line,#d8d3c6);background:var(--card,#fff);color:inherit}

a.dl{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}

.ver{text-align:center;font-size:12px;color:var(--muted,#6b756f);padding:18px 16px 28px;opacity:.85}.ver b{font-weight:700}
.zbtns{display:flex;gap:6px;flex-wrap:wrap}.zbtns button{flex:1;min-height:44px;padding:0 10px;font-size:14px}.zbtns button.on{outline:3px solid var(--accent,#F1B51C)}
.cand{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line,#d8d3c6);font-size:15px}.cand b{min-width:56px}.cand em{margin-left:auto;font-style:normal;color:var(--muted)}
.sheet button.primary{background:var(--btn);color:var(--btn-ink)}
.sheet button.primary:disabled{opacity:.4}
.cand input{width:22px;min-height:22px;height:22px;padding:0;flex:none;accent-color:var(--ink)}
.cand span{flex:none}
.evs{list-style:none;margin:8px 0;padding:0}.evs li{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;display:block;overflow:hidden;line-height:1.4}
.evs .ok{color:#2f9e5b;font-weight:700}.evs .no{color:var(--muted)}.evs button{float:right;margin:0 0 0 10px;min-height:36px;padding:0 14px}
.cand.big{align-items:flex-start}.chips{display:flex;flex-wrap:wrap;gap:4px;flex:1}.chip{font-style:normal;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}

.gem{border:1px solid var(--line,#ddd);border-radius:12px;padding:12px;margin:10px 0;display:grid;gap:10px}
.gem input[type=password]{width:100%;box-sizing:border-box}
.gem select{width:100%;box-sizing:border-box}
.gem .chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;min-width:0}
.gem .chk input{width:22px;min-width:22px;height:22px;min-height:22px;padding:0;margin:1px 0 0;flex:none;accent-color:var(--ink)}
.gem .chk span{flex:1;min-width:0}
.gem .gbtns{display:flex;gap:8px;flex-wrap:wrap}.gem .gbtns button{flex:1;min-height:44px}
.gem small{font-weight:400;opacity:.7}

.gemw{margin:0;padding:8px 10px 8px 26px;font-size:13px;line-height:1.4;background:rgba(241,181,28,.18);border-radius:8px}
.chk.extra{padding:10px 4px}

/* ===== desktop workspace (four steps) ===== */
#app.wide{max-width:none;margin:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;min-width:0}
.chk input{width:22px;min-width:22px;height:22px;min-height:22px;padding:0;margin:1px 0 0;flex:none;accent-color:var(--ink)}
.chk span{flex:1;min-width:0}
.wsnav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:20px;min-height:60px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.wsnav .brand{flex:none;font-size:19px;text-decoration:none}
.wsnav nav{display:flex;gap:2px;flex:1;justify-content:center;min-width:0}
.wsnav nav a,.wsnav nav .dis{display:flex;align-items:center;gap:8px;padding:0 16px;height:60px;text-decoration:none;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.wsnav nav .dis{opacity:.45}
.wsnav nav a:hover{color:var(--ink)}
.wsnav nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
.wsnav nav i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:800}
.wsnav nav a.on i{background:var(--accent);color:#14211B}
.wsmeta{display:flex;align-items:center;gap:10px;flex:none}
.wsmeta div{display:flex;flex-direction:column;text-align:right;line-height:1.2}
.wsmeta b{font-size:14px}.wsmeta small{font-size:12px}
.wsmeta .icon{width:40px;height:40px;display:grid;place-items:center;font-size:20px;font-weight:700;text-decoration:none;border-radius:10px}
.ws{display:grid;gap:20px;padding:20px;align-items:start}
.ws-video{grid-template-columns:minmax(320px,1fr) minmax(0,1.3fr);max-width:1400px;margin:0 auto}

<body>
<div id="app"></div>
<footer class="ver" id="ver">Version <b id="verTxt">6 Nov 2026, 12:53</b></footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const DB=(()=>{
// Tiny IndexedDB wrapper. Match data (teams, moments, tags, signals) lives on the device only.
const DB_NAME = 'pitchside', STORE = 'matches';

function open() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
const tx = async (mode, fn) => {
  const db = await open();
  return new Promise((resolve, reject) => {
    const t = db.transaction(STORE, mode);
    const req = fn(t.objectStore(STORE));
    t.oncomplete = () => { db.close(); resolve(req && req.result); };
    t.onerror = () => { db.close(); reject(t.error); };
    t.onabort = () => { db.close(); reject(t.error); };
  });
};

const allMatches = async () => ((await tx('readonly', s => s.getAll())) || []).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
const getMatch = id => tx('readonly', s => s.get(id));
const saveMatch = m => tx('readwrite', s => s.put(m));
const deleteMatch = id => tx('readwrite', s => s.delete(id));
const newId = () => (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

return {allMatches,getMatch,saveMatch,deleteMatch,newId};})();
const {pickMime,drawStats,makeHighlightsVideo}=(()=>{
// Pitchside highlights exporter.
// Plays the chosen clips from the match video into a canvas, draws a broadcast-style score graphic on top,
// and records the result with MediaRecorder. Everything happens in the browser; nothing is uploaded.

const NAVY = '#0B1F3A', YEL = '#F1B51C', WHITE = '#FFFFFF', GREEN = '#14804A', CLAY = '#D9552B';
const abbr = s => String(s || '').replace(/[^A-Za-z0-9 ]/g, '').trim().split(/\s+/)[0].slice(0, 3).toUpperCase() || '---';
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const clock = sec => { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; };

function pickMime() {
  const c = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  if (typeof MediaRecorder === 'undefined') return null;
  return c.find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (_) { return false; } }) || null;
}

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}


// Sky-style team stats panel. d = { us, them, rows: [[label, a, b], ...], title, sub }. prog (0..1) animates the bars.
function drawStats(ctx, W, H, d, prog = 1) {
  const s = W / 1280, f = n => n * s;
  const GRN = '#3DD68C', CLY = '#FF7A50', INK = '#EEF3EE', MUT = '#98A89F';
  const t = (str, x, y, size, color, weight = 800, align = 'left') => {
    ctx.font = `${weight} ${Math.round(f(size))}px system-ui, "Segoe UI", Roboto, Arial, sans-serif`;
    ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y);
  };
  ctx.save();
  ctx.fillStyle = '#0C1511'; ctx.fillRect(0, 0, W, H);
  const hh = Math.round(H * 0.17);
  ctx.fillStyle = '#14201A'; ctx.fillRect(0, 0, W, hh);
  ctx.fillStyle = '#F1B51C'; ctx.fillRect(0, hh, W, f(4));
  const badge = (cx, name, col) => {
    const r = hh * 0.34;
    ctx.beginPath(); ctx.arc(cx, hh / 2, r, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
    t(abbr(name), cx, hh / 2 + f(1), r / s * 0.62, '#0C1511', 900, 'center');
  };
  const padX = f(64), r0 = hh * 0.34, maxN = W * 0.5 - padX - r0 * 2 - f(18) - f(150);
  const fit = (str, size) => { ctx.font = `800 ${Math.round(f(size))}px system-ui, "Segoe UI", Roboto, Arial, sans-serif`; str = String(str); while (str.length > 3 && ctx.measureText(str).width > maxN) str = str.slice(0, -2).trimEnd() + '\u2026'; return str; };
  badge(padX + r0, d.us, GRN); t(fit(d.us, 30), padX + r0 * 2 + f(18), hh / 2, 30, INK, 800, 'left');
  badge(W - padX - r0, d.them, CLY); t(fit(d.them, 30), W - padX - r0 * 2 - f(18), hh / 2, 30, INK, 800, 'right');
  t(d.title || 'MATCH STATS', W / 2, hh / 2 - f(8), 22, '#F1B51C', 800, 'center');
  if (d.sub) t(d.sub, W / 2, hh / 2 + f(16), 16, MUT, 600, 'center');
  let strip = 0;
  if (d.scorers) {
    strip = f(44); const sy = hh + f(4) + strip / 2 + f(6);
    t(d.scorers.us.length ? d.scorers.us.join('  ') : '', padX, sy, 20, MUT, 700, 'left');
    t('GOALS', W / 2, sy, 15, '#5E7066', 800, 'center');
    t(d.scorers.them.length ? d.scorers.them.join('  ') : '', W - padX, sy, 20, MUT, 700, 'right');
  }
  const rows = d.rows || [], top = hh + f(24) + strip, avail = H - top - f(20), rh = avail / Math.max(1, rows.length);
  const bx0 = padX, bx1 = W - padX, bw = bx1 - bx0, bh = Math.max(f(8), rh * 0.11);
  rows.forEach(([label, a, b], i) => {
    const cy = top + rh * i + rh / 2;
    t(String(a), bx0, cy - rh * 0.16, 34, INK, 900, 'left');
    t(String(b), bx1, cy - rh * 0.16, 34, INK, 900, 'right');
    t(label, W / 2, cy - rh * 0.16, 22, MUT, 700, 'center');
    const tot = a + b, real = tot ? a / tot : 0.5, share = 0.5 + (real - 0.5) * prog, y = cy + rh * 0.2, gap = f(5);
    const ua = Math.max(0, bw * share - gap / 2), tb = Math.max(0, bw * (1 - share) - gap / 2);
    ctx.fillStyle = tot ? GRN : '#25352C'; rr(ctx, bx0, y, Math.max(f(4), ua), bh, bh / 2); ctx.fill();
    ctx.fillStyle = tot ? CLY : '#25352C'; rr(ctx, bx1 - Math.max(f(4), tb), y, Math.max(f(4), tb), bh, bh / 2); ctx.fill();
  });
  ctx.restore();
}

// clips: [{ start, end, kind:'goal'|'other', label, side, goalAt, before:{us,them}, after:{us,them} }]
async function makeHighlightsVideo(file, { clips, us, them, title = 'Highlights', dateText = '', finalScore = null,
  scoreboard = true, sbPos = 'tl', stats = null,
  width = 1280, fps = 30, onProgress = () => {}, signal } = {}) {
  const mime = pickMime();
  if (!mime) throw new Error("This browser can't record video. Try Chrome or Edge on a computer.");
  if (!clips || !clips.length) throw new Error('Nothing to export yet.');

  const url = URL.createObjectURL(file);
  const v = document.createElement('video');
  v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto';
  v.style.cssText = 'position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none';
  v.src = url; document.body.appendChild(v);
  let ac = null, recorder = null, raf = 0, stopped = false;
  const cleanup = () => {
    stopped = true; cancelAnimationFrame(raf);
    try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch (_) {}
    try { v.pause(); } catch (_) {}
    v.removeAttribute('src'); try { v.load(); } catch (_) {}
    v.remove(); URL.revokeObjectURL(url);
    if (ac) try { ac.close(); } catch (_) {}
    document.removeEventListener('visibilitychange', onVis);
  };
  const aborted = () => signal && signal.aborted;
  let paused = false;
  const onVis = () => {
    // browsers freeze canvas/video work in hidden tabs; hold the recording until the tab is back
    if (stopped) return;
    if (document.hidden) { paused = true; try { v.pause(); if (recorder && recorder.state === 'recording') recorder.pause(); } catch (_) {} }
    else if (paused) { paused = false; try { if (recorder && recorder.state === 'paused') recorder.resume(); } catch (_) {} if (curClip) v.play().catch(() => {}); }
  };
  let curClip = null;

  try {
    await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error("The video can't be read by this browser.")); });
    const vw = v.videoWidth || 1280, vh = v.videoHeight || 720;
    const W = Math.min(width, vw) & ~1, H = Math.round(W * vh / vw) & ~1;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const k = W / 1280;                                   // everything is designed at 1280 wide
    const stream = cv.captureStream(fps);

    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const src = ac.createMediaElementSource(v);
      const dest = ac.createMediaStreamDestination();
      src.connect(dest);                                  // not connected to the speakers: export is silent
      if (ac.resume) await ac.resume();
      dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    } catch (_) { ac = null; }

    const chunks = [];
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: Math.round(3500000 * Math.max(.6, k)), audioBitsPerSecond: 128000 });
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped$ = new Promise(r => recorder.onstop = r);
    recorder.start(1000);
    document.addEventListener('visibilitychange', onVis);

    // ---- planned length, for the progress bar
    const INTRO = 2.6, OUTRO = 3.2, STATS = stats ? 8 : 0;
    const total = INTRO + OUTRO + STATS + clips.reduce((s, c) => s + (c.end - c.start), 0);
    let done = 0;
    const report = (extra = 0) => onProgress({ frac: Math.min(1, (done + extra) / total), done: done + extra, total });

    // ---- drawing
    const text = (t, x, y, size, color, weight = 800, align = 'left') => {
      ctx.font = `${weight} ${Math.round(size * k)}px system-ui, "Segoe UI", Roboto, Arial, sans-serif`;
      ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(t, x * k, y * k);
    };
    const scorebug = (score, flash) => {
      const h = 52, nameW = 78, numW = 50;
      const total = nameW * 2 + numW * 2 + 6;
      const x = sbPos === 'tr' ? 1280 - 36 - total : 36, y = 34;
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 12 * k;
      rr(ctx, x * k, y * k, total * k, h * k, 10 * k); ctx.fillStyle = NAVY; ctx.fill(); ctx.restore();
      // numbers
      const nx1 = x + nameW, nx2 = x + nameW + numW + 6;
      ctx.fillStyle = flash ? YEL : WHITE; ctx.fillRect(nx1 * k, y * k, numW * k, h * k); ctx.fillRect(nx2 * k, y * k, numW * k, h * k);
      ctx.fillStyle = 'rgba(11,31,58,.18)'; ctx.fillRect((nx2 - 3) * k, y * k, 6 * k, h * k);
      text(abbr(us), x + nameW / 2, y + h / 2, 22, WHITE, 800, 'center');
      text(abbr(them), x + nameW + numW * 2 + 6 + nameW / 2, y + h / 2, 22, WHITE, 800, 'center');
      text(String(score.us), nx1 + numW / 2, y + h / 2 + 1, 30, NAVY, 900, 'center');
      text(String(score.them), nx2 + numW / 2, y + h / 2 + 1, 30, NAVY, 900, 'center');
      // accent strip under the bug
      ctx.fillStyle = YEL; ctx.fillRect(x * k, (y + h) * k, total * k, 4 * k);
    };
    const banner = (clip, t, sinceGoal) => {
      // lower-third that slides in when the goal goes in
      const a = ease(sinceGoal / 0.45), out = ease((sinceGoal - 4.4) / 0.5);
      const slide = (1 - a) * 520 + out * 520;
      const x = 36 - slide, y = 590, h = 84;
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 16 * k;
      ctx.fillStyle = YEL; ctx.fillRect(x * k, y * k, 190 * k, h * k);
      ctx.fillStyle = NAVY; ctx.fillRect((x + 190) * k, y * k, 560 * k, h * k); ctx.restore();
      text('GOAL!', x + 95, y + h / 2 + 1, 38, NAVY, 900, 'center');
      const who = clip.side === 'us' ? us : clip.side === 'them' ? them : '';
      if (who) text(who.toUpperCase(), x + 214, y + 28, 24, YEL, 800);
      const sc = clip.after ? `${abbr(us)} ${clip.after.us} – ${clip.after.them} ${abbr(them)}` : '';
      text(sc, x + 214, y + 60, 30, WHITE, 900);

  const out = new Float64Array(L);
  for (let i = 0; i < L; i++) {
    const a = i - left, b = i + right;
    const lo = Math.max(a, 0), hi = Math.min(b, L - 1);
    let sum = pre[hi + 1] - pre[lo];
    if (a < 0) sum += x[0] * (-a);
    if (b > L - 1) sum += x[L - 1] * (b - (L - 1));

// ---------------------------------------------------------------- signals -> moments + curves
function processSignals(raw, duration, o = {}) {
  const opt = { ...DEFAULTS, ...o };
  const fps = opt.sampleFps;
  const N = Math.min(raw.pan.length, Math.ceil(duration * fps));
  const sl = a => Float64Array.from(a).subarray(0, N);
  const pan = sl(raw.pan), resid = sl(raw.resid);
  const hasAudio = !!(raw.loud && raw.whistle);
  const t = new Float64Array(N); for (let i = 0; i < N; i++) t[i] = i / fps;

  const absPan = pan.map(Math.abs);
  const fResid = smooth(rz(resid), 3);
  const fPan = smooth(rz(absPan), 3);
  const fLoud = hasAudio ? smooth(rz(sl(raw.loud)), 3) : zeros(N);
  const fWhistle = hasAudio ? rz(sl(raw.whistle)) : zeros(N);
  const w = hasAudio ? { loud: 0.40, whistle: 0.15, resid: 0.25, pan: 0.20 } : { loud: 0, whistle: 0, resid: 0.55, pan: 0.45 };

  // ignore the first few seconds: decoding/audio start-up glitches look like action
  const warm = Math.min(N, Math.ceil(3 * fps));
  for (let i = 0; i < warm; i++) { fResid[i] = 0; fPan[i] = 0; fLoud[i] = 0; fWhistle[i] = 0; }
  let score = new Float64Array(N);
  for (let i = 0; i < N; i++) score[i] = w.loud * fLoud[i] + w.whistle * fWhistle[i] + w.resid * fResid[i] + w.pan * fPan[i];
  score = smooth(score, 3);

  // --- highlight candidates
  const base = Math.max(6, Math.min(25, Math.floor(duration / 60 * 0.6) + 4));
  const maxN = opt.maxClips || Math.max(3, Math.round(base * opt.maxClipsMult));
  const thresh = Math.max(opt.minScore, percentile(score, 90));
  const order = Array.from(score.keys()).sort((a, b) => score[b] - score[a]);
  const chosen = [];
  for (const i of order) {
    if (score[i] < thresh || chosen.length >= maxN) break;
    if (chosen.every(j => Math.abs(t[i] - t[j]) >= opt.minGap)) chosen.push(i);
  }
  chosen.sort((a, b) => a - b);
  const events = chosen.map((i, k) => {
    const kinds = { loud: fLoud[i] * w.loud, whistle: fWhistle[i] * w.whistle, motion: fResid[i] * w.resid + fPan[i] * w.pan };
    const main = Object.keys(kinds).reduce((a, b) => kinds[a] >= kinds[b] ? a : b);
    const label = { loud: 'Crowd or shouting spike', whistle: 'Whistle', motion: 'Fast play or camera sweep' }[main];
    return { id: k + 1, time: t[i], start: Math.max(0, t[i] - opt.pre), end: Math.min(duration, t[i] + opt.post),

  });

  // --- momentum curves (experimental): where the play is, relative to the direction we attack
  const act = smooth(Array.from({ length: N }, (_, i) => Math.max(0, fResid[i]) + Math.max(0, fPan[i]) + 0.5 * Math.max(0, fLoud[i])), 5);
  const pos = new Float64Array(N);
  let acc = 0; for (let i = 0; i < N; i++) { acc += pan[i]; pos[i] = acc; }
  const win = Math.floor(90 * fps) | 1;
  const trend = smooth(pos, win);
  const posRel = new Float64Array(N);
  for (let i = 0; i < N; i++) posRel[i] = pos[i] - trend[i];
  const p95 = percentile(posRel.map(Math.abs), 95) + 1e-9;
  const half = opt.halfTime && opt.halfTime > 0 ? opt.halfTime : duration / 2;
  const right = opt.attackDir !== 'left';
  const usRaw = new Float64Array(N), themRaw = new Float64Array(N);
  for (let i = 0; i < N; i++) {
    const dir = (t[i] < half) ? (right ? 1 : -1) : (right ? -1 : 1);
    const side = Math.max(-1, Math.min(1, posRel[i] / p95 * dir));
    usRaw[i] = act[i] * (0.25 + 0.75 * Math.max(0, side));
    themRaw[i] = act[i] * (0.25 + 0.75 * Math.max(0, -side));
  }
  const sw = Math.floor(20 * fps);
  const us = smooth(usRaw, sw), them = smooth(themRaw, sw);
  let mx = 1e-9; for (let i = 0; i < N; i++) mx = Math.max(mx, us[i], them[i]);
  const ds = Math.max(1, Math.floor(5 * fps));
  const curves = { t: [], us: [], them: [] };
  for (let i = 0; i < N; i += ds) {
    curves.t.push(Math.round(t[i] * 10) / 10);
    curves.us.push(Math.round(us[i] / mx * 1000) / 10);
    curves.them.push(Math.round(them[i] / mx * 1000) / 10);
  }
  return { events, curves, hasAudio, half };
}

// ---------------------------------------------------------------- goal finder
// A goal usually looks like: a sustained crowd roar, then a lull while players celebrate and walk back,
// then a restart whistle from the centre circle. Score every moment for that pattern and return the best n.
const NF = 6;                                   // number of goal features
const DEFAULT_W = [1, 0, 0.35, 0.12, 0, 0];     // hand-set weights: roar + lull + restart whistle
function goalSeries(raw, duration, fps, model) {
  const N = Math.min(raw.loud.length, Math.ceil(duration * fps));
  const sl = a => Float64Array.from(a).subarray(0, N);
  const loudz = smooth(rz(sl(raw.loud)), 3), resz = smooth(rz(sl(raw.resid)), 5), whz = rz(sl(raw.whistle));
  const idx = s => Math.max(0, Math.min(N - 1, Math.round(s * fps)));
  const mean = (a, s0, s1) => { const i0 = idx(s0), i1 = Math.max(i0 + 1, idx(s1)); let t = 0; for (let i = i0; i < i1; i++) t += a[i]; return t / (i1 - i0); };
  const maxOf = (a, s0, s1) => { let m = -Infinity; for (let i = idx(s0); i <= idx(s1); i++) m = Math.max(m, a[i]); return m; };
  const clip = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const feats = Array.from({ length: NF }, () => new Float32Array(N));
  for (let i = 0; i < N; i++) {
    const t = i / fps;
    feats[0][i] = mean(loudz, t, t + 12);                                  // sustained roar
    feats[1][i] = maxOf(loudz, t - 2, t + 8);                              // peak of the roar
    feats[2][i] = -clip(mean(resz, t + 10, t + 40), -3, 3);                // lull while players celebrate / walk back
    feats[3][i] = clip(maxOf(whz, t + 15, t + 60), 0, 6);                  // restart whistle
    feats[4][i] = clip(maxOf(whz, t - 5, t + 10), 0, 6);                   // whistle at the time
    feats[5][i] = clip(mean(resz, t + 40, t + 70) - mean(resz, t + 10, t + 40), -3, 3);   // play picks up again
  }
  const w = model && model.w && model.w.length === NF ? model.w : DEFAULT_W;
  const score = new Float64Array(N);
  for (let i = 0; i < N; i++) { let x = 0; for (let k = 0; k < NF; k++) x += w[k] * feats[k][i]; score[i] = x; }
  const snap = t0 => { let bi = idx(t0), bv = -Infinity; for (let i = idx(t0 - 4); i <= idx(t0 + 8); i++) if (loudz[i] > bv) { bv = loudz[i]; bi = i; } return bi / fps; };
  return { N, score, idx, snap, feats };
}

// Learn what a goal looks like from goals you have confirmed (scoreboard, typed times or taps).
// Logistic regression on the six features. Returns weights to store and reuse on later matches.
function trainGoalModel(raw, duration, goalTimes, { sampleFps = 2, prev = null } = {}) {
  if (!raw || !raw.loud || !goalTimes.length) return null;
  const fps = sampleFps, { N, feats, idx } = goalSeries(raw, duration, fps);
  const pos = [], neg = [];
  const near = i => goalTimes.reduce((m, g) => Math.min(m, Math.abs(g - i / fps)), Infinity);
  for (const g of goalTimes) for (let d = -2; d <= 2; d += 0.5) pos.push(idx(g + d));
  for (let i = Math.round(60 * fps); i < N - 60 * fps; i += 3) if (near(i) > 60) neg.push(i);
  if (pos.length < 4 || neg.length < 20) return null;
  const w = new Float64Array(NF).fill(0); let b = 0;
  const pw = Math.min(25, neg.length / pos.length) * 0.6, lr = 0.05;
  for (let it = 0; it < 600; it++) {
    const gw = new Float64Array(NF); let gb = 0;
    const acc = (i, y, wt) => {
      let z = b; for (let k = 0; k < NF; k++) z += w[k] * feats[k][i];
      const p = 1 / (1 + Math.exp(-z)), e = (p - y) * wt;
      for (let k = 0; k < NF; k++) gw[k] += e * feats[k][i]; gb += e;
    };
    for (const i of pos) acc(i, 1, pw); for (const i of neg) acc(i, 0, 1);
    const tot = pos.length * pw + neg.length;
    for (let k = 0; k < NF; k++) w[k] -= lr * (gw[k] / tot + 0.01 * w[k]) * 10;
    b -= lr * gb / tot * 10;

  const n = goalTimes.length, np = prev && prev.n ? prev.n : 0;
  const wf = Array.from(w, (x, k) => np ? (x * n + prev.w[k] * np) / (n + np) : x);
  const model = { w: wf, n: n + np };
  // in-sample check: where do the confirmed goals rank when we pick the top-N moments?
  const found = findGoals(raw, duration, { n: goalTimes.length, sampleFps: fps, model });
  const hit = goalTimes.filter(g => found.some(f => Math.abs(f.time - g) < 45)).length;
  return { model, hit, total: goalTimes.length };
}

function findGoals(raw, duration, { n = 7, halfTime = 0, sampleFps = 2, minGap = 75, model = null } = {}) {
  if (!raw || !raw.loud) return [];
  const fps = sampleFps, { N, score, snap } = goalSeries(raw, duration, fps, model);
  const blocked = t => t < 60 || t > duration - 60 || (halfTime > 0 && Math.abs(t - halfTime) < 60);
  const order = Array.from(score.keys()).sort((a, b) => score[b] - score[a]);
  const out = [];
  for (const i of order) {
    const t = i / fps;
    if (out.length >= n * 3) break;
    if (blocked(t)) continue;
    if (out.every(o => Math.abs(o.t0 - t) >= minGap)) out.push({ t0: t, s: score[i] });
  }
  return out.map(o => ({ time: snap(o.t0), score: Math.round(o.s * 100) / 100 })).slice(0, n);
}

// The scoreboard in the corner of the picture only changes when someone scores. The scan records how much each
// score box changed compared with 4 s earlier; a real digit change shows as a bump lasting a few seconds.
function findScoreChanges(sd, fps = 2) {
  if (!sd) return { changes: [], noisy: false };
  const found = [];
  let noisy = false;
  for (const key of ['h', 'a']) {
    const x = sd[key]; if (!x || !x.length) continue;
    const med = median(x), dev = Float64Array.from(x, v => Math.abs(v - med)), mad = median(dev) * 1.4826 + 0.3;
    const thr = Math.max(5, med + 9 * mad);
    if (med > 4) noisy = true;               // the box keeps changing: probably covers the match clock or video noise
    let i = 0;
    while (i < x.length) {
      if (x[i] > thr) {
        let j = i; while (j < x.length && x[j] > thr) j++;
        const dur = (j - i) / fps;
        if (dur >= 2 && dur <= 14) found.push({ time: i / fps, side: key, strength: Math.max(...x.slice(i, j)) });
        i = j;
      } else i++;

  }
  found.sort((a, b) => a.time - b.time);
  // both boxes lighting up together is a graphic flash, not a goal
  const changes = found.filter(f => !found.some(o => o !== f && o.side !== f.side && Math.abs(o.time - f.time) < 3));
  return { changes, noisy };
}

// scoreboards update a little after the goal: look back for the crowd roar that caused it
function snapToRoar(raw, duration, tChange, { sampleFps = 2, lookBack = 50, fallback = 8 } = {}) {
  if (!raw || !raw.loud) return Math.max(0, tChange - fallback);
  const { score, idx, snap } = goalSeries(raw, duration, sampleFps);
  let bi = -1, bv = -Infinity;
  for (let i = idx(Math.max(0, tChange - lookBack)); i <= idx(tChange); i++) if (score[i] > bv) { bv = score[i]; bi = i; }
  return bv > 0.8 && bi >= 0 ? snap(bi / sampleFps) : Math.max(0, tChange - fallback);
}

// ---------------------------------------------------------------- frame comparison (pan + leftover motion)
const FW = 160, FH = 90;
function compareFrames(prev, cur) {
  const W = FW, H = FH;
  const cx = new Float32Array(W), px = new Float32Array(W);
  for (let y = 0; y < H; y++) {
    const o = y * W;
    for (let x = 0; x < W; x++) { cx[x] += cur[o + x]; px[x] += prev[o + x]; }
  }
  for (let x = 0; x < W; x++) { cx[x] /= H; px[x] /= H; }
  const maxS = Math.round(W * 0.12);
  let best = 0, bestE = Infinity;
  for (let s = -maxS; s <= maxS; s++) {
    let e = 0;
    for (let x = maxS; x < W - maxS; x++) e += Math.abs(cx[x] - px[x - s]);
    if (e < bestE) { bestE = e; best = s; }
  }
  const m = 6;
  let sum = 0, n = 0;
  for (let y = m; y < H - m; y++) {
    const o = y * W;
    for (let x = maxS; x < W - maxS; x++) { sum += Math.abs(cur[o + x] - prev[o + x - best]); n++; }
  }
  return { pan: -best / W, resid: sum / Math.max(1, n) };
}

// ---------------------------------------------------------------- the scan
async function probeVideo(file) {
  const url = URL.createObjectURL(file);
  const v = document.createElement('video');
  v.preload = 'metadata'; v.muted = true; v.src = url;
  try {
    await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error('unreadable')); });
    return { duration: v.duration, width: v.videoWidth, height: v.videoHeight };
  } finally { URL.revokeObjectURL(url); }
}

async function scanVideo(file, { rate = 4, sampleFps = 2, onProgress = () => {}, signal, scoreBoxes = null } = {}) {
  const url = URL.createObjectURL(file);
  const v = document.createElement('video');
  v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto';
  v.style.cssText = 'position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none';
  v.src = url;

  // The analyser is deliberately NOT connected to the speakers: the scan is silent.
  let ac = null, an = null;

    clearInterval(tAudio); clearInterval(tProg); clearInterval(tFrame);
    if (onVis) document.removeEventListener('visibilitychange', onVis);

    v.removeAttribute('src'); try { v.load(); } catch (_) {}

    if (wake) try { wake.release(); } catch (_) {}
  };

  try {
    await new Promise((res, rej) => {
      v.onloadedmetadata = res;
      v.onerror = () => rej(new Error("This video format can't be read by your browser. Try an .mp4 (H.264) file."));
    });

    if (!isFinite(duration) || duration < 20) throw new Error('That video looks too short or unreadable.');
    const N = Math.ceil(duration * sampleFps) + 2;

    v.onerror = () => finish('error');
    if (signal) signal.addEventListener('abort', () => finish('abort'));

    // So: pause while the tab is hidden, carry on when it is back.

const TYPES = {
  goal: { label: 'Goal', ch: 'G' },
  sot: { label: 'Shot on target', ch: 'S' },
  off: { label: 'Shot off target', ch: 'S', hollow: true },
  corner: { label: 'Corner won', ch: 'C' },
  kickin: { label: 'Kick-in', ch: 'K' },
  goalkick: { label: 'Goal kick', ch: 'G' },
  save: { label: 'Save by keeper', ch: 'K' },
  foul: { label: 'Foul committed', ch: 'F' },
  yellow: { label: 'Yellow card', ch: 'Y' },
  red: { label: 'Red card', ch: 'R' },
  highlight: { label: 'Highlight (no stat)', ch: 'H' },
};
function stats(m) {
  const z = () => ({ goals: 0, shots: 0, sot: 0, corners: 0, kickins: 0, goalkicks: 0, saves: 0, fouls: 0, yellow: 0, red: 0 });
  const r = { us: z(), them: z() };
  for (const e of m.events || []) {
    if (!e.type || e.type === 'skip' || !e.side) continue;
    const a = r[e.side], b = r[e.side === 'us' ? 'them' : 'us'];
    if (e.type === 'goal') { a.goals++; a.shots++; a.sot++; }
    else if (e.type === 'sot') { a.shots++; a.sot++; }
    else if (e.type === 'off') a.shots++;
    else if (e.type === 'corner') a.corners++;
    else if (e.type === 'kickin') a.kickins++;
    else if (e.type === 'goalkick') a.goalkicks++;
    else if (e.type === 'save') { a.saves++; b.shots++; b.sot++; }   // a save implies a shot on target by the other side
    else if (e.type === 'foul') a.fouls++;
    else if (e.type === 'yellow') a.yellow++;
    else if (e.type === 'red') a.red++;
  }
  return r;
}

function matchCsv(m) {
  const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const row = (...c) => c.map(q).join(',');
  const st = stats(m), g = goalsOf(m);
  const out = [row('Match', `${m.us} v ${m.them}`), row('Date', m.date || ''),
    row('Score (from tagged goals)', `${st.us.goals}-${st.them.goals}`), '', row('Stat', m.us, m.them),
    row('Goals', st.us.goals, st.them.goals), row('Shots', st.us.shots, st.them.shots), row('Shots on target', st.us.sot, st.them.sot),
    row('Corners', st.us.corners, st.them.corners), row('Saves', st.us.saves, st.them.saves), row('Fouls', st.us.fouls, st.them.fouls), row('Kick-ins', st.us.kickins, st.them.kickins), row('Goal kicks', st.us.goalkicks, st.them.goalkicks), '',
    row('Video time', 'Event', 'Team', 'Score after')];
  const ev = (m.events || []).filter(e => e.type && e.type !== 'skip').sort((a, b) => a.time - b.time);
  for (const e of ev) {
    const sc = e.type === 'goal' && e.side ? (() => { const r = scoreAt(m, e.time, true); return `${r.us}-${r.them}`; })() : '';
    out.push(row(clock(e.time), TYPES[e.type] ? TYPES[e.type].label : e.type, e.side ? (e.side === 'us' ? m.us : m.them) : '', sc));
  }

}

async function importAnalysis(m, file) {

  m.duration = j.duration || (m.video && m.video.duration) || 0;

function drawSpark(vals) {
  const c = $('#spark'); if (!c) return;
  const ctx = c.getContext('2d'), w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);
  const mx = Math.max(1e-6, ...vals), bw = w / 120;
  const css = getComputedStyle(document.documentElement);
  ctx.fillStyle = css.getPropertyValue('--us').trim() || '#14804A';
  vals.slice(-120).forEach((v, i) => { const bh = Math.max(2, h * v / mx); ctx.fillRect(i * bw, h - bh, Math.max(1, bw - 1), bh); });
}
function scanView(m) {

// ------------------------------------------------------------ summary
function flowChart(m) {
  const W = 600, H = 262, mid = 118, amp = 84, pad = 10, dur = m.duration, c = m.curves;
  const X = t => pad + (W - 2 * pad) * Math.min(1, t / dur);
  const yU = v => mid - amp * v / 100, yT = v => mid + amp * v / 100;
  const pts = (arr, f) => c.t.map((t, i) => `${X(t).toFixed(1)},${f(arr[i]).toFixed(1)}`);
  const area = (arr, f) => `M${X(c.t[0]).toFixed(1)},${mid} L${pts(arr, f).join(' L')} L${X(c.t[c.t.length - 1]).toFixed(1)},${mid} Z`;
  const line = (arr, f) => `M${pts(arr, f).join(' L')}`;
  const step = dur > 5400 ? 1800 : dur > 2400 ? 900 : dur > 900 ? 300 : 60;
  let ticks = '';
  for (let t = 0; t <= dur + 1; t += step) ticks += `<text x="${X(t).toFixed(1)}" y="256" text-anchor="${t === 0 ? 'start' : 'middle'}">${Math.round(t / 60)}'</text>`;
  const hx = X(m.half || dur / 2).toFixed(1);
  let marks = '';
  for (const e of hlList(m)) {
    if (e.type && e.side) {
      const T = TYPES[e.type], y = e.side === 'us' ? 15 : 226;
      marks += `<g class="mk ${e.side}${T.hollow ? ' hollow' : ''}" data-id="${e.id}"><circle r="17" cx="${X(e.time).toFixed(1)}" cy="${y}" fill="transparent"/>
        <circle class="dot" r="10.5" cx="${X(e.time).toFixed(1)}" cy="${y}"/><text class="mt" x="${X(e.time).toFixed(1)}" y="${y + 4}" text-anchor="middle">${T.ch}</text></g>`;
    } else {
      marks += `<g class="mk raw" data-id="${e.id}"><circle r="12" cx="${X(e.time).toFixed(1)}" cy="${mid}" fill="transparent"/><circle class="udot" r="3.5" cx="${X(e.time).toFixed(1)}" cy="${mid}"/></g>`;
    }
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Match flow chart: pressure for your team above the line, for the opponent below">
    <path d="${area(c.us, yU)}" class="a-us"/><path d="${area(c.them, yT)}" class="a-them"/>
    <line x1="${pad}" x2="${W - pad}" y1="${mid}" y2="${mid}" class="axis"/>
    <line x1="${hx}" x2="${hx}" y1="26" y2="212" class="ht"/>
    <path d="${line(c.us, yU)}" class="l-us"/><path d="${line(c.them, yT)}" class="l-them"/>
    ${ticks}<text x="${hx}" y="248" text-anchor="middle" class="htl">HT</text>
    ${marks}</svg>`;
}

function reelList(m) {
  const tagged = m.events.filter(e => e.type && e.type !== 'skip');
  const base = tagged.length ? tagged.filter(e => e.type !== 'foul' && e.type !== 'kickin' && e.type !== 'goalkick') : m.events.filter(e => e.type !== 'skip');
  return [...base].sort((a, b) => a.time - b.time);
}

// ------------------------------------------------------------ goals by time, scoreline, highlights video
const goalsOf = m => m.events.filter(e => e.type === 'goal' && e.side).sort((a, b) => a.time - b.time);
function scoreAt(m, t, inclusive) {
  const r = { us: 0, them: 0 };
  for (const e of goalsOf(m)) if (inclusive ? e.time <= t : e.time < t) r[e.side]++;
  return r;
}
function parseClockTime(str) {
  const p = str.split(':').map(Number); if (p.some(n => !isFinite(n))) return null;
  return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : null;
}
function sideFromText(m, t) {
  const x = t.toLowerCase().trim(); if (!x) return null;
  const first = n => String(n).toLowerCase().split(/\s+/)[0];
  if (/^(us|we|home|ours|our)\b/.test(x) || x.startsWith(first(m.us))) return 'us';
  if (/^(them|they|away|opp|opposition|theirs)\b/.test(x) || x.startsWith(first(m.them))) return 'them';
  return null;
}
function addGoalAt(m, t, side) {
  const pre = m.preGoal ?? 10, post = m.postGoal ?? 10, dur = m.duration || t + post;
  const near = m.events.find(e => e.type !== 'skip' && (e.type === 'goal' || !e.type) && Math.abs(e.time - t) < 15);
  if (near) {
    near.type = 'goal'; near.manual = true; near.guess = false; near.label = 'Goal'; if (side) near.side = side;
    near.time = t; near.start = Math.max(0, t - pre); near.end = Math.min(dur, t + post);
    return near;
  }
  const e = { id: 0, time: t, start: Math.max(0, t - pre), end: Math.min(dur, t + post), score: null, label: 'Goal', type: 'goal', side: side || null, manual: true };
  m.events.push(e); return e;
}
function addMomentsFrom(m, list) {
  const dur = m.duration || 1e9;
  for (const x of list) {
    if (!TYPES[x.type] || (!x.side && x.type !== 'highlight')) continue;
    if (m.events.some(e => e.type !== 'skip' && Math.abs(e.time - x.t) < 6 && (e.type === x.type || e.type === 'goal'))) continue;
    m.events.push({ id: 0, time: x.t, start: Math.max(0, x.t - 5), end: Math.min(dur, x.t + 8), score: null, label: TYPES[x.type].label, type: x.type, side: x.side || null, manual: false, fromGemini: true });
  }
}
function finishEventEdit(m, selE) {
  const keep = selE === undefined ? m.events.find(e => e.id === S.sel) : selE;
  m.events.sort((a, b) => a.time - b.time); m.events.forEach((e, i) => e.id = i + 1);
  S.sel = keep ? keep.id : null;
  DB.saveMatch(m); drawMarks(m); updateCount(m); if (S.onChange) S.onChange();
}
function addGoalsFromText(m) {
  const raw = $('#goalTimes').value; if (!raw.trim()) return toast('Type the goal times first');
  const bad = []; let n = 0;
  for (const part of raw.split(/[\n;,]+/).map(x => x.trim()).filter(Boolean)) {
    const mt = part.match(/^(\d{1,2}:)?\d{1,3}:\d{2}/);
    const t = mt ? parseClockTime(mt[0]) : null;
    if (t == null) { bad.push(part); continue; }
    if (m.duration && t > m.duration + 1) { bad.push(part + ' (past the end of the video)'); continue; }
    addGoalAt(m, t, sideFromText(m, part.slice(mt[0].length).replace(/^[\s\-:]+/, ''))); n++;
  }
  finishEventEdit(m);
  if (n) $('#goalTimes').value = '';
  toast(bad.length ? `Added ${n}. Could not read: ${bad.join(', ')}` : `Added ${n} goal${n === 1 ? '' : 's'}. Check who scored on each.`);
}

function clipsFor(m, mode) {
  const pre = m.preGoal ?? 10, post = m.postGoal ?? 10, dur = m.duration || 1e9;
  let list = m.events.filter(e => e.type && e.type !== 'skip' && e.type !== 'foul' && e.type !== 'kickin' && e.type !== 'goalkick' && TYPES[e.type]).sort((a, b) => a.time - b.time);
  if (mode === 'goals') list = list.filter(e => e.type === 'goal');
  const clips = list.map(e => {
    if (e.type === 'goal') {
      const before = scoreAt(m, e.time, false), after = e.side ? scoreAt(m, e.time, true) : before;
      return { kind: 'goal', label: 'Goal', side: e.side, goalAt: e.time, start: Math.max(0, e.time - pre), end: Math.min(dur, e.time + post), before, after: e.side ? after : null, id: e.id };
    }
    const sc = scoreAt(m, e.time, true);
    return { kind: 'other', label: `${TYPES[e.type].label}${e.side ? ' · ' + (e.side === 'us' ? m.us : m.them) : ''}`, side: e.side, start: e.start, end: Math.min(dur, e.end), before: sc, after: sc, id: e.id };
  }).sort((a, b) => a.start - b.start);
  const out = [];
  for (const c of clips) {
    const p = out[out.length - 1];
    if (p && c.start < p.end) {
      if (c.kind === 'goal' && p.kind !== 'goal') { p.end = Math.min(p.end, c.start); if (p.end - p.start < 3) out.pop(); }
      else { c.start = p.end; if (c.end - c.start < 3) continue; }
    }
    out.push(c);
  }
  return out;
}

// ------------------------------------------------------------ step 3: review highlights
const FILTERS = [['all', 'All'], ['goal', 'Goals'], ['shots', 'Shots'], ['save', 'Saves'], ['corner', 'Corners'], ['kickin', 'Kick-ins'], ['goalkick', 'Goal kicks'], ['foul', 'Fouls'], ['cards', 'Cards'], ['highlight', 'Highlights']];
const inFilter = (e, f) => f === 'all' || (f === 'shots' ? (e.type === 'sot' || e.type === 'off') : f === 'cards' ? (e.type === 'yellow' || e.type === 'red') : f === 'skipped' ? e.type === 'skip' : e.type === f);
function statRows(m) {
  const st = stats(m);
  const rows = [['Goals', st.us.goals, st.them.goals], ['Shots', st.us.shots, st.them.shots], ['Shots on target', st.us.sot, st.them.sot],
    ['Saves', st.us.saves, st.them.saves], ['Corners', st.us.corners, st.them.corners], ['Fouls', st.us.fouls, st.them.fouls]];
  if (st.us.kickins + st.them.kickins) rows.push(['Kick-ins', st.us.kickins, st.them.kickins]);
  if (st.us.goalkicks + st.them.goalkicks) rows.push(['Goal kicks', st.us.goalkicks, st.them.goalkicks]);
  if (st.us.yellow + st.them.yellow) rows.push(['Yellow cards', st.us.yellow, st.them.yellow]);   // cards are rare, so only shown when there are some
  if (st.us.red + st.them.red) rows.push(['Red cards', st.us.red, st.them.red]);

}
// match minute from the optional kick-off times (video seconds) on the Video step
function minuteLabel(m, t) {
  if (m.ko1 == null) return null;
  const h = m.halfLen || 45;
  if (m.ko2 != null && t >= m.ko2) { const n = h + Math.floor((t - m.ko2) / 60) + 1; return n > 2 * h ? `${2 * h}+${n - 2 * h}\u2032` : `${n}\u2032`; }
  const n = Math.max(1, Math.floor((t - m.ko1) / 60) + 1);
  return m.ko2 != null && n > h ? `${h}+${n - h}\u2032` : `${n}\u2032`;
}
function scorersOf(m) {
  if (m.ko1 == null) return null;
  const by = side => (m.events || []).filter(e => e.type === 'goal' && e.side === side).sort((x, y) => x.time - y.time).map(e => minuteLabel(m, e.time));
  const us = by('us'), them = by('them');
  return us.length || them.length ? { us, them } : null;
}
const statsData = m => ({ us: m.us, them: m.them, rows: statRows(m), scorers: scorersOf(m), title: 'MATCH STATS', sub: `${m.us} v ${m.them} · ${fmtDate(m.date)}` });
function drawStatsCanvas(m) { const cv = $('#statsCv'); if (cv) drawStats(cv.getContext('2d'), cv.width, cv.height, statsData(m), 1); }

function hlRow(m, e) {

  const head = `<button class="hlHead" data-act="sel" aria-expanded="${sel}"><span class="dot ${e.side || 'none'}"></span><b>${clock(e.time)}</b>
    <span class="hlType">${skipped ? 'Skipped' : T ? T.label : 'Pick what happened'}</span><span class="hlWho">${who || (skipped || e.type === 'highlight' ? '' : 'Who?')}</span></button>`;
  const body = !sel ? '' : skipped ? `<div class="hlBody"><div class="hlBtns"><button class="ghost sm" data-act="skip">Restore this highlight</button></div></div>` : `<div class="hlBody">
      <div class="hlRow"><label>What happened<select data-act="type"><option value="">Pick…</option>${Object.entries(TYPES).map(([k, t]) => `<option value="${k}" ${e.type === k ? 'selected' : ''}>${t.label}</option>`).join('')}</select></label>
        <div class="who"><span>Who</span><div class="seg sm" data-act="side"><button data-side="us" class="${e.side === 'us' ? 'on' : ''}">${esc(m.us)}</button><button data-side="them" class="${e.side === 'them' ? 'on' : ''}">${esc(m.them)}</button></div></div></div>

function evidenceFor(m, n) {

    const cs = findGoals(m.raw, m.duration, { n: Math.max(12, (n || 6) * 3), halfTime: m.halfTime, sampleFps: 2, model: loadModel() });
    const top = Math.max(0.0001, ...cs.map(c => c.score));
    cs.forEach(c => ev.push({ src: 'crowd', t: c.time, conf: 0.2 + 0.3 * (c.score / top) })); notes.crowd = cs.length;
  }
  if (m.scoreEvents && m.scoreEvents.length) { m.scoreEvents.forEach(e => ev.push({ src: 'board', t: e.time, conf: m.scoreNoisy ? 0.35 : 0.9, side: e.side })); notes.board = m.scoreEvents.length; }
  if (m.ballTrack) {

    if (pts.length >= 20) {
      const z = m.ballTrack.zones || suggestZones(pts);
      const cs = findCandidates(pts, z, { sampleFps: m.ballTrack.fps || 2 });
      cs.forEach(c => ev.push({ src: c.restart ? 'ball' : 'ballMaybe', t: c.time, conf: c.restart ? 0.65 : 0.25 })); notes.ball = cs.length;
    }
  }
  if (m.sound) { const se = soundEvents(m.sound); ev.push(...se); notes.cheer = se.length; }
  if (m.speech) { const sp = speechEvents(m.speech); ev.push(...sp); notes.speech = sp.length; }
  if (m.gemini) { const ge = geminiEvents(m.gemini); ev.push(...ge); notes.gemini = ge.length; }
  return { ev, notes };
}

const KEEP = 'pitchside-keep', MODEL_KEY = '/__pitchside_ball_model';
async function saveBallModel(name, buffer) {
  try { const c = await caches.open(KEEP); await c.put(MODEL_KEY, new Response(buffer, { headers: { 'x-name': name } })); } catch (_) {}
}
async function restoreBallModel() {
  if (S.ball.name) return;
  try {
    const c = await caches.open(KEEP), r = await c.match(MODEL_KEY);
    if (r) { S.ball.name = r.headers.get('x-name') || 'ball model'; S.ball.buffer = await r.arrayBuffer(); S.ball.sess = null; }
  } catch (_) {}
}
function ballStateText() {
  if (!S.ball.name) return 'No model loaded yet.';
  const mb = S.ball.buffer ? ` (${(S.ball.buffer.byteLength / 1048576).toFixed(0)} MB)` : '';
  return `Model: ${esc(S.ball.name)}${mb}${S.ball.sess ? ` · ready, running on ${S.ball.sess.ep === 'webgpu' ? 'your graphics chip' : 'the CPU (slow)'}` : ''}. Kept on this device.`;

async function chooseBallModel(m, f) {

    S.ball = { name: f.name, buffer: buf, sess: null };

}

    <div class="zbtns"><button data-z="left">Left goal</button><button data-z="centre">Centre spot</button><button data-z="right">Right goal</button><button data-z="auto">Reset</button></div>
    <div id="rvList"></div>
    <button class="primary wide" id="rvAdd">Add to the match</button><button class="cancel" id="rvClose">Close</button></div>`;
  document.body.appendChild(scrim);
  const cv = $('#rvCv'), ctx = cv.getContext('2d'), vid = document.createElement('video');
  vid.muted = true; vid.preload = 'auto'; vid.src = S.fileUrl;
  const COL = { left: '#34C6F4', right: '#34C6F4', centre: '#E64B9B' }, NAME = { left: 'left goal', right: 'right goal', centre: 'centre spot' };
  const draw = () => {
    if (!cv.width) return;
    ctx.fillStyle = '#1b2a22'; ctx.fillRect(0, 0, cv.width, cv.height);
    if (vid.readyState >= 2) ctx.drawImage(vid, 0, 0, cv.width, cv.height);
    ctx.fillStyle = 'rgba(241,181,28,.5)';
    for (const p of pts) ctx.fillRect(p[1] * cv.width - 1.5, p[2] * cv.height - 1.5, 3, 3);
    for (const k of ['left', 'right', 'centre']) {
      const z = (drag && drag.k === k) ? drag.z : zones[k];
      ctx.lineWidth = 3; ctx.strokeStyle = COL[k]; ctx.strokeRect(z[0] * cv.width, z[2] * cv.height, (z[1] - z[0]) * cv.width, (z[3] - z[2]) * cv.height);
      ctx.fillStyle = COL[k]; ctx.font = '600 14px system-ui'; ctx.fillText(NAME[k], z[0] * cv.width + 4, z[2] * cv.height + 16);
    }
  };
  const recalc = () => {
    cands = findCandidates(pts, zones, { sampleFps: S.ballFps });
    pick.clear(); cands.forEach((c, i) => { if (c.restart) pick.add(i); });
    const likely = cands.filter(c => c.restart).length;
    $('#rvSum').textContent = `Likely goals found: ${likely}${m.finalUs != null ? ` (you told me the score was ${m.finalUs}–${m.finalThem}, so ${m.finalUs + m.finalThem} goals)` : ''}. Other times the ball reached a goal but no kick-off followed: ${cands.length - likely}.`;
    $('#rvList').innerHTML = cands.length ? cands.map((c, i) => `<label class="cand"><input type="checkbox" data-i="${i}" ${pick.has(i) ? 'checked' : ''}>
      <b>${clock(c.time)}</b><span>${c.end} goal</span><em>${c.restart ? 'Kick-off at ' + clock(c.restartAt) : 'maybe (shot or save?)'}</em></label>`).join('')
      : '<p class="note">No goal-like moments found. Check the boxes above.</p>';
    $$('#rvList input').forEach(cb => cb.onchange = () => { cb.checked ? pick.add(+cb.dataset.i) : pick.delete(+cb.dataset.i); upd(); });
    upd(); draw();
  };
  const upd = () => { const b = $('#rvAdd'); b.disabled = !pick.size; b.textContent = pick.size ? `Add ${pick.size} goal${pick.size === 1 ? '' : 's'} to the match` : 'Tick the goals to add'; };
  vid.onloadedmetadata = () => { cv.width = 720; cv.height = Math.round(720 * vid.videoHeight / vid.videoWidth); vid.currentTime = Math.min(vid.duration * 0.3, 600); draw(); };
  vid.onseeked = draw;
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) }; };
  cv.style.touchAction = 'none';
  cv.onpointerdown = e => { if (!armed) return; cv.setPointerCapture(e.pointerId); const p = pt(e); drag = { k: armed, x0: p.x, y0: p.y, z: [p.x, p.x, p.y, p.y] }; };
  cv.onpointermove = e => { if (!drag) return; const p = pt(e); drag.z = [Math.min(drag.x0, p.x), Math.max(drag.x0, p.x), Math.min(drag.y0, p.y), Math.max(drag.y0, p.y)]; draw(); };
  cv.onpointerup = () => {
    if (!drag) return;
    if (drag.z[1] - drag.z[0] > 0.01 && drag.z[3] - drag.z[2] > 0.01) { zones[drag.k] = drag.z; if (m.ballTrack) { m.ballTrack.zones = zones; DB.saveMatch(m); } }
    drag = null; armed = null; $$('.zbtns button').forEach(b => b.classList.remove('on')); recalc();
  };
  $$('.zbtns button').forEach(b => b.onclick = () => {
    if (b.dataset.z === 'auto') { zones = { left: auto.left.slice(), right: auto.right.slice(), centre: auto.centre.slice() }; armed = null; $$('.zbtns button').forEach(x => x.classList.remove('on')); return recalc(); }
    armed = armed === b.dataset.z ? null : b.dataset.z; $$('.zbtns button').forEach(x => x.classList.toggle('on', x.dataset.z === armed));
  });
  const close = () => { scrim.remove(); vid.removeAttribute('src'); vid.load(); };
  $('#rvClose').onclick = close;
  $('#rvAdd').onclick = async () => {
    if (!m.events) m.events = [];
    if (!m.duration) { m.duration = res.duration || m.video.duration; m.half = m.halfTime || m.duration / 2; }
    m.ballTrack = { fps: S.ballFps, duration: res.duration, zones, rows: res.rows.map(r => [+r[0].toFixed(2), +r[1].toFixed(4), +r[2].toFixed(4), +r[3].toFixed(2)]) };
    [...pick].sort((a, b) => cands[a].time - cands[b].time).forEach(i => addGoalAt(m, cands[i].time, null));
    await DB.saveMatch(m); close(); finishEventEdit(m);
    toast('Added. Check who scored on each one.'); go(`#/match/${m.id}/review`);
  };
  recalc();
}

// ------------------------------------------------------------ scoreboard marking
function markScoreArea(m, done) {
  if (!haveFile(m)) return needVideo();
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet wide" role="dialog" aria-label="Mark the score"><h4>Mark the score on the video</h4>
    <p class="note" id="markStep"></p>
    <div class="markwrap"><canvas id="markCv"></canvas></div>
    <label class="fld"><span>Pick a moment where the scoreboard is showing</span><input type="range" id="markT" min="0" max="1000" value="150"></label>
    <label class="fld"><span>The first score number belongs to</span><select id="markWho"><option value="us">${esc(m.us)}</option><option value="them">${esc(m.them)}</option></select></label>
    <button class="primary wide" id="markSave" disabled>Save</button><button class="ghost wide" id="markRedo">Start again</button><button class="cancel" id="markCancel">Cancel</button></div>`;
  document.body.appendChild(scrim);
  const cv = $('#markCv'), ctx = cv.getContext('2d'), vid = document.createElement('video');
  vid.muted = true; vid.preload = 'auto'; vid.src = S.fileUrl;
  const boxes = { home: null, away: null }; let step = 0, drag = null;
  const msg = () => $('#markStep').innerHTML = step === 0 ? 'Step 1 of 2: drag a box tightly around the <b>first team’s score number</b> only (not the clock).'
    : step === 1 ? 'Step 2 of 2: now drag a box around the <b>second team’s score number</b>.' : 'Both marked. Check the boxes cover just the numbers, then Save.';
  const draw = () => {
    if (vid.readyState >= 2) ctx.drawImage(vid, 0, 0, cv.width, cv.height);
    for (const [k, c] of [['home', '#F1B51C'], ['away', '#34C6F4']]) {
      const b = (drag && drag.k === k) ? drag.r : boxes[k]; if (!b) continue;
      ctx.lineWidth = 3; ctx.strokeStyle = c; ctx.strokeRect(b.x * cv.width, b.y * cv.height, b.w * cv.width, b.h * cv.height);
    }
  };
  const seek = () => { const t = (+$('#markT').value / 1000) * (m.video.duration || vid.duration || 0); vid.currentTime = Math.max(0, Math.min(t, (vid.duration || t) - 0.5)); };
  vid.onloadedmetadata = () => { cv.width = 720; cv.height = Math.round(720 * vid.videoHeight / vid.videoWidth); seek(); };
  vid.onseeked = draw;
  $('#markT').oninput = seek;
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) }; };
  cv.style.touchAction = 'none';
  cv.onpointerdown = e => { if (step > 1) return; cv.setPointerCapture(e.pointerId); const p = pt(e); drag = { k: step === 0 ? 'home' : 'away', x0: p.x, y0: p.y, r: { x: p.x, y: p.y, w: 0, h: 0 } }; };
  cv.onpointermove = e => { if (!drag) return; const p = pt(e); drag.r = { x: Math.min(drag.x0, p.x), y: Math.min(drag.y0, p.y), w: Math.abs(p.x - drag.x0), h: Math.abs(p.y - drag.y0) }; draw(); };
  cv.onpointerup = () => {
    if (!drag) return;
    if (drag.r.w > 0.005 && drag.r.h > 0.008) { boxes[drag.k] = drag.r; step++; msg(); $('#markSave').disabled = step < 2; }
    drag = null; draw();
  };
  $('#markRedo').onclick = () => { boxes.home = boxes.away = null; step = 0; $('#markSave').disabled = true; msg(); draw(); };
  const close = () => { scrim.remove(); vid.removeAttribute('src'); vid.load(); };
  $('#markCancel').onclick = close;
  $('#markSave').onclick = async () => { m.scoreBoxes = { home: boxes.home, away: boxes.away }; m.scoreHome = $('#markWho').value; await DB.saveMatch(m); close(); toast('Score area saved'); if (done) done(); };
  msg();
}

function loadModel() { try { const j = JSON.parse(lsGet('ps_goal_model', 'null')); return j && j.w && j.w.length === 6 ? j : null; } catch (_) { return null; } }

// ============================================================ go
if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname))) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
route();

</script>
